; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMICRO_ROS_TRANSPORT_SERIAL 
board_microros_transport = serial  
lib_deps =
  knolleary/PubSubClient
  madhephaestus/ESP32Encoder@^0.10.1
  bblanchon/ArduinoJson@^6.21.3
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BusIO
  https://github.com/micro-ROS/micro_ros_platformio

; Beispiel: setze hier deinen COM-Port oder /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Environment für OTA Upload
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMICRO_ROS_TRANSPORT_SERIAL 
board_microros_transport = serial  
lib_deps =
  knolleary/PubSubClient
  madhephaestus/ESP32Encoder@^0.10.1
  bblanchon/ArduinoJson@^6.21.3
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BusIO
  https://github.com/micro-ROS/micro_ros_platformio

  
upload_flags =
  --auth=deinOTAPass

; Hier muss später die IP deines ESP32 hin oder ein mDNS-Hostname
upload_port = 192.168.178.xxx  ; Beispiel
; upload_port = 192.168.8.xxx
upload_protocol = espota

